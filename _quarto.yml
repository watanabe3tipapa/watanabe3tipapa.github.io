# This file controls the settings for your Quarto template from github.com:watanabe3tipapa/watanabe3tipapa.github.io
# website settings
website:
  title: "watanabe3tipapa.github.io"                                # Your name
  description: "Neo-Brutalism Portal"
  site-url: https://watanabe3tipapa.github.io
  image: assets/bg.jpg
  favicon: assets/favicon.png
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: true
    logo: /assets/logo.png
    
    # your sub-pages
    left:
      - text: "INDEX"
        href: https://watanabe3tipapa.github.io/index/
      - text: "Projects"
        href: projects/project.qmd
      - text: "Articles"
        href: articles/note.qmd
      - text: "Internal Link"
        href: link/link.qmd
      - text: "Blog"
        href: https://watanabe3tipapa.github.io/watanabe3tipapa
    
    # your site and social media handles
    right:
      - text: "Gist"
        href: https://gist.github.com/watanabe3tipapa
      - icon: folder-symlink
        href: https://next.watanabe3ti.com/
      - icon: facebook
        href: https://www.facebook.com/toru.watanabe3ti/
      - icon: twitter
        href: https://twitter.com/watanabe3tipapa
      - icon: github
        href: https://github.com/watanabe3tipapa
      - icon: envelop
        aria-label: email
        href: "mailto:toruwatanabe3ti@gmail.com"  
  

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox
  page-footer: 
    left: |
      <span class="faux-block">&#169; 2026 watanabe3tipapa CC BY-SA 4.0</span>
    center: |
      <span class="faux-block"><a href="https://watanabe3tipapa.github.io/index/">All Sites / Services → INDEX</a></span>
    right: |
      <span class="faux-block"><a href="https://github.com/watanabe3tipapa/watanabe3tipapa.github.io/">View source on GitHub</a></span>

project:
  type: website
  output-dir: docs

  # 内部メモ・非公開ファイルをビルド対象から除外
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!DEV-MEMO.md"
  # 参照されない asset（アーカイブ等）も docs にコピー
  resources:
    - assets/archive/

  preview: 
    port: 23232
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1.15em
    theme: 
      - cosmo
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true

editor: visual